    <div class="viewport">
        <div class="camera-container">
            <video id="camera-view" autoplay playsinline></video>
            <div id="camera-guide"></div>
        </div>
        <canvas id="final-canvas"></canvas>

        <div id="selection-screen" style="display: none;">
            <h3 style="color: white; font-weight: bold; text-transform: uppercase; letter-spacing: 1px;">Select 3 Photos</h3>
            <div id="selection-grid"></div>
            <button id="confirm-selection-btn">Create Strip</button>
        </div>

        <div class="controls">
            <button id="start-btn">Start Shoot</button>
            <button id="download-btn" style="display:none; background:white;">Save Jpeg</button>
        </div>
    </div>

    <div class="sidebar-filters">
        <h3 style="text-align:center; color: white; margin-top: 0; margin-bottom: 20px;">TechnoBytes 2026</h3>
        <p style="text-align:center; font-size: 11px; color: #888; margin-bottom: 15px;">COLOR PROFILES</p>
        <div id="filter-container">
            <button class="filter-btn active" data-filter="none">Natural</button>
            <button class="filter-btn" data-filter="grayscale(1) contrast(1.2)">B&W</button>
            <button class="filter-btn" data-filter="sepia(0.6) brightness(1.1)">Vintage</button>
            <button class="filter-btn" data-filter="contrast(1.5) saturate(1.5)">High-Key</button>
            <button class="filter-btn" data-filter="hue-rotate(180deg) brightness(1.2)">Psychedelic</button>
            <button class="filter-btn" data-filter="brightness(1.3) contrast(0.9) saturate(0.8)">Soft Pastel</button>
        </div>
