<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechnoBytes</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body> 

<div id="flash"></div>

<div class="app-container">
    <div class="sidebar-frames" id="frame-sidebar">
        <p style="text-align:center; font-size: 11px; color: var(--accent); font-weight: bold;">SELECT FRAME</p>
     <img src="TechnoLayer1.png" class="frame-thumb" data-id="14" crossorigin="anonymous">
     <img src="StudentCouncil.png" class="frame-thumb" data-id="2" crossorigin="anonymous">
     <img src="StagLayer1.png" class="frame-thumb" data-id="3" crossorigin="anonymous">
     <img src="ChronLayer1.png" class="frame-thumb" data-id="4" crossorigin="anonymous">
     <img src="VigiLayer1.png" class="frame-thumb" data-id="13" crossorigin="anonymous">
     <img src="DonatoLayer1.png" class="frame-thumb" data-id="17" crossorigin="anonymous">
     <img src="SanrioLayer1.png" class="frame-thumb" data-id="16" crossorigin="anonymous">
     <img src="PinkLayer1.png" class="frame-thumb" data-id="6" crossorigin="anonymous">
     <img src="MeanGirlsLayer1.png" class="frame-thumb" data-id="7" crossorigin="anonymous">
     <img src="KittenLayer1.png" class="frame-thumb" data-id="8" crossorigin="anonymous">
     <img src="BlueLayer1.png" class="frame-thumb" data-id="9" crossorigin="anonymous">
     <img src="BlackLayer1.png" class="frame-thumb" data-id="10" crossorigin="anonymous">
     <img src="NerdLayer1.png" class="frame-thumb" data-id="11" crossorigin="anonymous">
     <img src="ReceiptLayer1.png" class="frame-thumb" data-id="12" crossorigin="anonymous">
     <img src="ShrekLayer1.png" class="frame-thumb" data-id="15" crossorigin="anonymous">



    </div>
    
    <!-- Preload Layer for sandwiching -->
    <img src="DonatoLayer1.png" id="donato-layer1" style="display:none;" crossorigin="anonymous">
    <img src="DonatoLayer2.png" id="donato-layer2" style="display:none;" crossorigin="anonymous">
    <img src="StudentCouncilLayer2.png" id="layer2-img" style="display:none;" crossorigin="anonymous">
    <img src="StudentCouncilLayer1.png" id="sc-overlay" style="display:none;" crossorigin="anonymous">
    <img src="StagLayer2.png" id="stag-layer2" style="display:none;" crossorigin="anonymous">
    <img src="StagLayer1.png" id="stag-layer1" style="display:none;" crossorigin="anonymous">
    <img src="ChronLayer1.png" id="chron-layer1" style="display:none;" crossorigin="anonymous">
    <img src="ChronLayer2.png" id="chron-layer2" style="display:none;" crossorigin="anonymous">
    <img src="PinkLayer1.png" id="pink-layer1" style="display:none;" crossorigin="anonymous">
    <img src="PinkLayer2.png" id="pink-layer2" style="display:none;" crossorigin="anonymous">
    <img src="MeanGirlsLayer1.png" id="mg-layer1" style="display:none;" crossorigin="anonymous">
    <img src="MeanGirlsLayer2.png" id="mg-layer2" style="display:none;" crossorigin="anonymous">
    <img src="KittenLayer1.png" id="kitten-layer1" style="display:none;" crossorigin="anonymous">
    <img src="KittenLayer2.png" id="kitten-layer2" style="display:none;" crossorigin="anonymous">
    <img src="BlueLayer1.png" id="blue-layer1" style="display:none;" crossorigin="anonymous">
    <img src="BlueLayer2.png" id="blue-layer2" style="display:none;" crossorigin="anonymous">
    <img src="BlackLayer1.png" id="black-layer1" style="display:none;" crossorigin="anonymous">
    <img src="BlackLayer2.png" id="black-layer2" style="display:none;" crossorigin="anonymous">
    <img src="NerdLayer1.png" id="nerd-layer1" style="display:none;" crossorigin="anonymous">
    <img src="NerdLayer2.png" id="nerd-layer2" style="display:none;" crossorigin="anonymous">
    <img src="ReceiptLayer1.png" id="receipt-layer1" style="display:none;" crossorigin="anonymous">
    <img src="ReceiptLayer2.png" id="receipt-layer2" style="display:none;" crossorigin="anonymous">
    <img src="VigiLayer1.png" id="vigi-layer1" style="display:none;" crossorigin="anonymous">
    <img src="VigiLayer2.png" id="vigi-layer2" style="display:none;" crossorigin="anonymous">
    <img src="TechnoLayer1.png" id="techno-layer1" style="display:none;" crossorigin="anonymous">
    <img src="TechnoLayer2.png" id="techno-layer2" style="display:none;" crossorigin="anonymous">
    <img src="ShrekLayer1.png" id="shrek-layer1" style="display:none;" crossorigin="anonymous">
    <img src="ShrekLayer2.png" id="shrek-layer2" style="display:none;" crossorigin="anonymous">
    <img src="SanrioLayer1.png" id="sanrio-layer1" style="display:none;" crossorigin="anonymous">
    <img src="SanrioLayer2.png" id="sanrio-layer2" style="display:none;" crossorigin="anonymous">

    <div class="viewport">
        <video id="camera-view" autoplay playsinline></video>
        <canvas id="final-canvas"></canvas>

        <div class="controls">
            <button id="start-btn">Start Shoot</button>
            <button id="download-btn" style="display:none; background:white;">Save Jpeg</button>
        </div>
    </div>

    <div class="sidebar-filters">
        <h3 style="text-align:center; color: white; margin-top: 0; margin-bottom: 20px;">TechnoBytes 2026</h3>
        <p style="text-align:center; font-size: 11px; color: #888; margin-bottom: 15px;">COLOR PROFILES</p>
        <div id="filter-container">
            <button class="filter-btn active" data-filter="none">Natural</button>
            <button class="filter-btn" data-filter="grayscale(1) contrast(1.2)">B&W</button>
            <button class="filter-btn" data-filter="sepia(0.6) brightness(1.1)">Vintage</button>
            <button class="filter-btn" data-filter="contrast(1.5) saturate(1.5)">High-Key</button>
            <button class="filter-btn" data-filter="hue-rotate(180deg) brightness(1.2)">Psychedelic</button>
            <button class="filter-btn" data-filter="brightness(1.3) contrast(0.9) saturate(0.8)">Soft Pastel</button>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
